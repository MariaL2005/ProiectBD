<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Donate - AdoptNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header-placeholder"></div>
<main class="apply-page container">
    <div class="form-column">
        <h1>Support Our Mission</h1>
        <form id="formDonatie" class="application-form">
            <div class="input-group">
                <label>Shelter</label>
                <select id="idAdapost" required><option>Loading...</option></select>
            </div>
            <div class="input-group">
                <label>Amount (RON)</label><input type="number" id="suma" required>
            </div>
            <div class="input-group">
                <label>Message</label><input type="text" id="descriere">
            </div>
            <button type="submit" class="form-submit-btn">Send Donation</button>
        </form>
        <div id="msg"></div>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('http://localhost:3000/api/adaposturi');
        const data = await res.json();
        const sel = document.getElementById('idAdapost');
        sel.innerHTML = '<option value="" disabled selected>Choose Shelter</option>';
        data.forEach(s => sel.innerHTML += `<option value="${s.ID}">${s.NUME}</option>`);
    });

    document.getElementById('formDonatie').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            idAdapost: document.getElementById('idAdapost').value,
            suma: document.getElementById('suma').value,
            descriere: document.getElementById('descriere').value
        };
        const res = await fetch('http://localhost:3000/api/finante/donatie', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        document.getElementById('msg').innerText = res.ok ? "Thank you!" : "Error processing donation";
    });
</script>
</body>
</html>
