<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admit Pet - AdoptNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header-placeholder"></div>
<main class="apply-page">
    <div class="apply-container container">
        <div class="form-column">
            <h1>Smart Admission</h1>
            <form id="formAdmisie" class="application-form">
                <div class="input-group">
                    <label>Name</label><input type="text" id="nume" required>
                </div>
                <div class="input-group">
                    <label>Species</label>
                    <select id="specie" required>
                        <option value="Caine">Dog</option>
                        <option value="Pisica">Cat</option>
                        <option value="Pasare">Bird</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Breed</label><input type="text" id="rasa">
                </div>
                <div class="input-group">
                    <label>Birth Date</label><input type="date" id="data">
                </div>
                <div class="input-group">
                    <label>Target Shelter</label>
                    <select id="adapostDorit" required><option>Loading...</option></select>
                </div>
                <button type="submit" class="form-submit-btn">Process Admission</button>
            </form>
            <div id="statusMsg"></div>
        </div>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('http://localhost:3000/api/adaposturi');
        const data = await res.json();
        const sel = document.getElementById('adapostDorit');
        sel.innerHTML = '<option value="" disabled selected>Select Shelter</option>';
        data.forEach(s => sel.innerHTML += `<option value="${s.ID}">${s.NUME}</option>`);
    });

    document.getElementById('formAdmisie').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            nume: document.getElementById('nume').value,
            specie: document.getElementById('specie').value,
            rasa: document.getElementById('rasa').value,
            dataNastere: document.getElementById('data').value,
            idAdapostDorit: document.getElementById('adapostDorit').value
        };
        const res = await fetch('http://localhost:3000/api/animale/admisie', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        const msg = document.getElementById('statusMsg');
        msg.innerText = result.message;
        msg.style.color = res.ok ? 'green' : 'red';
    });
</script>
</body>
</html>
