<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet - Find Your Best Friend</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="apply-page" style="display: block;">
    <div class="container" style="max-width: 1200px; margin: 0 auto; padding-top: 40px;">
        <section class="application-form" style="margin-bottom: 40px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;">

            <div class="input-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <label for="filterShelter" style="color: #444;">Shelter Location</label>
                <select id="filterShelter">
                    <option value="">All Shelters</option>
                </select>
            </div>

            <div class="input-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <label for="filterBreed" style="color: #444;">Search by Breed</label>
                <input type="text" id="filterBreed" placeholder="e.g. Maidanez, ciobanesc...">
            </div>

            <div class="input-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <label for="filterSpecies" style="color: #444;">Species</label>
                <select id="filterSpecies">
                    <option value="">All Species</option>
                    <option value="Caine">Dog (Câine)</option>
                    <option value="Pisica">Cat (Pisică)</option>
                    <option value="Pasare">Bird (Pasăre)</option>
                </select>
            </div>

            <button type="button" id="btnFilter" class="form-submit-btn" style="width: auto; padding: 12px 30px; margin-top: 0;">
                Apply Filters
            </button>
        </section>

        <div id="animalGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding-bottom: 100px;">
            <p style="color: var(--accent-gold);">Loading available pets...</p>
        </div>

    </div>
</main>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const animalGrid = document.getElementById('animalGrid');
        const btnFilter = document.getElementById('btnFilter');
        const filterShelter = document.getElementById('filterShelter');

        // --- FUNCȚIE NOUĂ: ÎNCĂRCARE ADĂPOSTURI DIN BAZA DE DATE ---
        async function loadShelters() {
            try {
                const response = await fetch('http://localhost:3000/api/adaposturi');
                const adaposturi = await response.json();

                // Păstrăm opțiunea "All Shelters" și le adăugăm pe cele din DB
                adaposturi.forEach(ad => {
                    const option = document.createElement('option');
                    option.value = ad.ID;
                    option.textContent = ad.NUME;
                    filterShelter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading shelters:', error);
            }
        }

        // Funcția care încarcă animalele de la server
        async function loadAnimals() {
            const shelter = document.getElementById('filterShelter').value;
            const breed = document.getElementById('filterBreed').value.trim();
            const species = document.getElementById('filterSpecies').value;

            animalGrid.innerHTML = '<p style="color: var(--accent-gold);">Searching for pets...</p>';

            try {
                let url = `http://localhost:3000/api/animale?status=DISPONIBIL`;
                if (shelter) url += `&id_adapost=${shelter}`;
                if (breed) url += `&rasa=${encodeURIComponent(breed)}`;
                if (species) url += `&specie=${encodeURIComponent(species)}`;

                const response = await fetch(url);
                const animals = await response.json();

                if (response.ok && animals.length > 0) {
                    let html = '';
                    animals.forEach(a => {
                        html += `
                            <div style="background-color: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column;">
                                <div style="background-color: #EAEAEA; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 48px;">
                                    ${(a.SPECIE === 'Pisica' || a.SPECIE === 'Pisici') ? '🐱' : '🐶'}
                                </div>
                                <div style="padding: 25px; display: flex; flex-direction: column; flex: 1;">
                                    <h3 style="font-size: 24px; color: #213A1D; margin-bottom: 5px; font-weight: 700;">${a.NUME}</h3>
                                    <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
                                        <strong>Breed:</strong> ${a.RASA || 'Unknown'}<br>
                                        <strong>Shelter:</strong> ${a.ID_ADAPOST}
                                    </p>
                                    <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid #EEE; text-align: right;">
                                        <a href="animal-details.html?id=${a.ID}" class="cta-button" style="display: inline-block; font-size: 13px;">View Profile</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    animalGrid.innerHTML = html;
                } else {
                    animalGrid.innerHTML = `<p style="color: #FFF4D9; grid-column: 1/-1;">No pets found matching your criteria.</p>`;
                }
            } catch (error) {
                console.error('Error fetching animals:', error);
                animalGrid.innerHTML = `<p style="color: #FF8A80; grid-column: 1/-1;">Error connecting to the server.</p>`;
            }
        }

        // Inițializăm pagina
        loadShelters(); // Mai întâi încărcăm lista de locații
        loadAnimals();  // Apoi încărcăm toate animalele

        if (btnFilter) {
            btnFilter.addEventListener('click', loadAnimals);
        }
    });
</script>
</body>
</html>
