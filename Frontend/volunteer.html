<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Team - Apply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="apply-page">
    <div class="apply-container">

        <div class="form-column">
            <h1 class="form-main-title">Become the Heart of Our Shelters</h1>

            <form id="applyForm" class="application-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="firstName">First name</label>
                        <input type="text" id="firstName" name="prenume" placeholder="Value" required>
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" name="nume" placeholder="Value" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Value" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="telefon" placeholder="Value" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="roleType">Position / Function</label>
                        <select id="roleType" name="roleType" required>
                            <option value="">-- Select Role --</option>
                            <option value="MEDIC">Veterinarian (Medic)</option>
                            <option value="INGRIJITOR">Caretaker (Îngrijitor)</option>
                            <option value="VOLUNTAR">Volunteer (Voluntar)</option>
                            <option value="EXTERN">External Partner</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="shelter">Select Shelter</label>
                        <select id="shelter" name="id_adapost" required>
                            <option value="">-- Loading locations... --</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Animal Specialization</label>
                    <div class="checkbox-group">
                        <label class="custom-checkbox"><input type="checkbox" name="specializare" value="Caini"><span>Dogs</span></label>
                        <label class="custom-checkbox"><input type="checkbox" name="specializare" value="Pisici"><span>Cats</span></label>
                        <label class="custom-checkbox"><input type="checkbox" name="specializare" value="Pasari"><span>Birds</span></label>
                    </div>

                    <div class="input-group" style="margin-top: 20px;">
                        <label>Languages Spoken</label>
                        <div id="languagesContainer" class="checkbox-group">
                            <p style="font-size: 12px; color: #666;">Loading languages...</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="form-submit-btn">Submit Application</button>
            </form>
        </div>

        <div class="image-column">
            <img src="../assets/images/about-puppy.jpg" alt="Volunteer with a rescued dog">
        </div>

    </div>
</main>

<section class="exchange-section" style="background-color: var(--primary-green); padding-bottom: 100px;">
    <div class="container">
        <hr style="border: 0; border-top: 1px solid rgba(255,244,217,0.2); margin: 0 0 60px 0;">

        <div class="exchange-wrapper" style="max-width: 800px; margin: 0 auto; text-align: center;">
            <h2 class="form-main-title" style="font-size: 36px;">Already an employee?</h2>
            <p style="color: var(--accent-gold); margin-bottom: 30px; opacity: 0.8;">
                Find your perfect match for an international experience exchange based on your skills and languages.
            </p>

            <div class="application-form" style="display: flex; gap: 15px; align-items: flex-end; text-align: left;">
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <label for="empIdSearch">Enter your Employee ID</label>
                    <input type="number" id="empIdSearch" placeholder="e.g. 101" required>
                </div>
                <button type="button" id="btnCheckExchange" class="form-submit-btn" style="width: auto; padding: 12px 30px; margin-top: 0;">
                    Check Opportunities
                </button>
            </div>

            <div id="exchangeResults" style="margin-top: 30px; color: white;"></div>
        </div>
    </div>
</section>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const shelterSelect = document.getElementById('shelter');
        const languagesContainer = document.getElementById('languagesContainer');

        // 1. Încărcăm adăposturile din bază
        try {
            const res = await fetch('http://localhost:3000/api/adaposturi');
            const data = await res.json();
            shelterSelect.innerHTML = '<option value="">-- Choose location --</option>';
            data.forEach(s => {
                shelterSelect.innerHTML += `<option value="${s.ID}">${s.NUME}</option>`;
            });
        } catch (err) { shelterSelect.innerHTML = '<option>Error loading shelters</option>'; }

        // 2. Încărcăm limbile din bază
        try {
            const res = await fetch('http://localhost:3000/api/limbi');
            const data = await res.json();
            languagesContainer.innerHTML = '';
            data.forEach(l => {
                languagesContainer.innerHTML += `
                    <label class="custom-checkbox">
                        <input type="checkbox" name="id_limba" value="${l.ID}">
                        <span>${l.NUME}</span>
                    </label>
                `;
            });
        } catch (err) { languagesContainer.innerHTML = '<p>Error loading languages.</p>'; }

        // 3. Logică verificare schimb experiență
        document.getElementById('btnCheckExchange').addEventListener('click', async () => {
            const empId = document.getElementById('empIdSearch').value;
            const resultsDiv = document.getElementById('exchangeResults');
            if (!empId) return alert("Please enter an ID.");

            resultsDiv.innerHTML = "Searching...";
            try {
                const res = await fetch(`http://localhost:3000/api/schimb-experienta/${empId}`);
                const data = await res.json();

                if (data.length === 0) {
                    resultsDiv.innerHTML = "<p>No matching exchange opportunities found for your profile yet.</p>";
                } else {
                    let html = '<ul style="list-style: none; padding: 0;">';
                    data.forEach(match => {
                        html += `<li style="background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 8px;">
                            Match found at <strong>${match.ADAPOST_DESTINATIE}</strong> (${match.ORAS_DESTINATIE})
                            - Language match: ${match.LIMBA_COMUNA}
                        </li>`;
                    });
                    html += '</ul>';
                    resultsDiv.innerHTML = html;
                }
            } catch (err) { resultsDiv.innerHTML = "Error checking opportunities."; }
        });
    });
</script>
</body>
</html>
