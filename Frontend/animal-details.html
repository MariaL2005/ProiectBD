<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Profile - Shelter Management</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            margin-top: 30px;
        }

        .info-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .history-section {
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 700;
            color: var(--primary-green);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-DISPONIBIL {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-ADOPTAT {
            background: #fff3e0;
            color: #ef6c00;
        }

        .edit-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
            color: #333;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px; top: 20px;
            font-size: 24px; cursor: pointer; color: #888;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="container" style="padding-top: 120px; padding-bottom: 60px;">
    <div id="loadingMessage">Loading animal profile...</div>

    <div id="mainContent" style="display: none;">
        <div class="details-grid">
            <div class="info-card" style="text-align: center;">
                <div id="animalIcon" style="font-size: 80px; margin-bottom: 20px;">🐶</div>
                <h2 id="animalName" style="font-size: 32px; margin-bottom: 10px;">Name</h2>
                <span id="animalStatus" class="status-badge">STATUS</span>
                <hr style="margin: 20px 0; opacity: 0.1;">
                <p><strong>ID:</strong> <span id="displayId"></span></p>
                <p><strong>Shelter:</strong> <span id="displayShelter"></span></p>
            </div>

            <div class="info-card">
                <button class="edit-btn" id="btnUpdate">Save Changes</button>
                <h3 style="margin-bottom: 20px;">General Information</h3>
                <form id="editForm" class="application-form" style="box-shadow: none; padding: 0;">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Species</label>
                            <input type="text" id="editSpecie" required>
                        </div>
                        <div class="input-group">
                            <label>Breed</label>
                            <input type="text" id="editRasa">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Description / Notes</label>
                        <textarea id="editDescriere" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd; min-height: 100px;"></textarea>
                    </div>
                </form>
            </div>
        </div>

        <section class="history-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="form-main-title" style="font-size: 28px;">Medical History</h3>
                <button class="edit-btn" onclick="showModal('modalMedical')">+ Add Intervention</button>
            </div>
            <table id="medicalTable">
                <thead>
                <tr><th>Date</th><th>Type</th><th>Description</th><th>Cost (RON)</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="history-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="form-main-title" style="font-size: 28px;">Adoption History</h3>
                <button class="edit-btn" onclick="showModal('modalAdoptie')" id="btnOpenAdopt" style="display:none;">+ Register Adoption</button>
                <button class="edit-btn" onclick="showModal('modalReturn')" id="btnOpenReturn" style="display:none; background-color: #dc3545;">🔄 Return Animal</button>
            </div>
            <table id="adoptionTable">
                <thead>
                <tr><th>Date</th><th>Person</th><th>Return Date</th><th>Reason</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <div id="modalMedical" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalMedical')">&times;</span>
            <h3>Add Medical Intervention</h3>
            <form id="formMedical">
                <div class="input-group"><label>Type</label><input type="text" id="medTip" required></div>
                <div class="input-group"><label>Description</label><textarea id="medDesc"></textarea></div>
                <div class="input-group"><label>Cost</label><input type="number" id="medCost" required></div>
                <button type="submit" class="form-submit-btn">Save</button>
            </form>
        </div>
    </div>

    <div id="modalAdoptie" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalAdoptie')">&times;</span>
            <h3>Register Adoption</h3>
            <p>Enter Adopter Details:</p>
            <form id="formAdoptie">
                <div class="input-group"><label>First Name</label><input type="text" id="adoptPrenume" required></div>
                <div class="input-group"><label>Last Name</label><input type="text" id="adoptNume" required></div>
                <div class="input-group"><label>Phone</label><input type="text" id="adoptTel" required></div>
                <div class="input-group"><label>Email</label><input type="email" id="adoptEmail" required></div>
                <button type="submit" class="form-submit-btn">Confirm Adoption</button>
            </form>
        </div>
    </div>

    <div id="modalReturn" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalReturn')">&times;</span>
            <h3 style="color: #dc3545;">Return to Shelter</h3>
            <form id="formReturn">
                <div class="input-group">
                    <label>Reason for Return</label>
                    <textarea id="retMotiv" required style="width: 100%; min-height: 80px;"></textarea>
                </div>
                <button type="submit" class="form-submit-btn" style="background-color: #dc3545;">Confirm Return</button>
            </form>
        </div>
    </div>

</main>

<script src="js/main.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const animalId = urlParams.get('id');

    async function loadProfile() {
        if (!animalId) return;
        try {
            const response = await fetch(`http://localhost:3000/api/animale/${animalId}`);
            if (!response.ok) throw new Error("Failed to fetch");

            const animal = await response.json(); // Backend-ul trimite tot obiectul animalului direct

            // Populare UI
            document.getElementById('animalName').innerText = animal.NUME;
            document.getElementById('displayId').innerText = animal.ID;
            document.getElementById('displayShelter').innerText = animal.NUME_ADAPOST || 'N/A';
            document.getElementById('animalStatus').innerText = animal.STATUS;
            document.getElementById('animalStatus').className = 'status-badge status-' + animal.STATUS;

            const isCat = animal.SPECIE.toLowerCase().includes('pisi');
            document.getElementById('animalIcon').innerText = isCat ? '🐱' : '🐶';

            // Butoane
            document.getElementById('btnOpenAdopt').style.display = animal.STATUS === 'DISPONIBIL' ? 'inline-block' : 'none';
            document.getElementById('btnOpenReturn').style.display = animal.STATUS === 'ADOPTAT' ? 'inline-block' : 'none';

            // Formular editare
            document.getElementById('editSpecie').value = animal.SPECIE;
            document.getElementById('editRasa').value = animal.RASA || '';
            document.getElementById('editDescriere').value = animal.DESCRIERE || '';

            // Tabel Medical
            const medBody = document.querySelector('#medicalTable tbody');
            medBody.innerHTML = animal.medicalHistory.length ? animal.medicalHistory.map(m => `
                <tr>
                    <td>${new Date(m.DATA_INTERVENTIE).toLocaleDateString()}</td>
                    <td>${m.TIPUL}</td>
                    <td>${m.DESCRIERE || '-'}</td>
                    <td>${m.COST}</td>
                </tr>
            `).join('') : '<tr><td colspan="4">No records.</td></tr>';

            // Tabel Adopții
            const adoptBody = document.querySelector('#adoptionTable tbody');
            adoptBody.innerHTML = animal.adoptionHistory.length ? animal.adoptionHistory.map(a => `
                <tr>
                    <td>${new Date(a.DATA_ADOPTIE).toLocaleDateString()}</td>
                    <td>${a.NUME_PERSOANA}</td>
                    <td>${a.DATA_RETURNARE ? new Date(a.DATA_RETURNARE).toLocaleDateString() : '-'}</td>
                    <td>${a.MOTIV_RETURNARE || '-'}</td>
                </tr>
            `).join('') : '<tr><td colspan="4">No records.</td></tr>';

            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

        } catch (error) {
            console.error(error);
            document.getElementById('loadingMessage').innerText = "Could not load animal profile data.";
        }
    }

    // Funcții utilitare modale (dacă nu sunt în main.js)
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Salvare Modificări
    document.getElementById('btnUpdate').addEventListener('click', async () => {
        const data = {
            specie: document.getElementById('editSpecie').value,
            rasa: document.getElementById('editRasa').value,
            descriere: document.getElementById('editDescriere').value
        };
        const res = await fetch(`http://localhost:3000/api/animale/${animalId}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (res.ok) { alert("Updated!"); loadProfile(); }
    });

    // Submit Adopție (Creează persoană + record adopție)
    document.getElementById('formAdoptie').addEventListener('submit', async (e) => {
        e.preventDefault();
        // Aici Backend-ul tău ar trebui să aibă o rută care acceptă aceste date.
        // Dacă nu ai una specială, va trebui să o facem.
        alert("This requires a custom route for registering person + adoption.");
    });

    // Submit Retur
    document.getElementById('formReturn').addEventListener('submit', async (e) => {
        e.preventDefault();
        const motiv = document.getElementById('retMotiv').value;
        const res = await fetch(`http://localhost:3000/api/animale/${animalId}/return`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ motiv })
        });
        if (res.ok) { alert("Returned!"); closeModal('modalReturn'); loadProfile(); }
    });

    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
