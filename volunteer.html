<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Team - Apply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="apply-page">
    <div class="apply-container">

        <div class="form-column">
            <h1 class="form-main-title">Become the Heart of Our Shelters</h1>

            <form id="applyForm" class="application-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="firstName">First name</label>
                        <input type="text" id="firstName" name="prenume" placeholder="Value" required>
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" name="nume" placeholder="Value" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Value" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="telefon" placeholder="Value" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="roleType">Position / Function</label>
                        <select id="roleType" name="roleType" required>
                            <option value="">-- Select Role --</option>
                            <option value="MEDIC">Veterinarian (Medic)</option>
                            <option value="INGRIJITOR">Caretaker (Îngrijitor)</option>
                            <option value="VOLUNTAR">Volunteer (Voluntar)</option>
                            <option value="EXTERN">External Partner</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="shelter">Select Shelter</label>
                        <select id="shelter" name="id_adapost" required>
                            <option value="">-- Choose location --</option>
                            <option value="1">Shelter București</option>
                            <option value="2">Shelter Berlin</option>
                            <option value="3">Shelter Paris</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Animal Specialization</label>
                    <div class="checkbox-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="specializare" value="Caini">
                            <span>Dogs</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="specializare" value="Pisici">
                            <span>Cats</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="specializare" value="Pasari">
                            <span>Birds</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="specializare" value="Rozatoare">
                            <span>Rodents</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="form-submit-btn">Submit Application</button>
            </form>
        </div>

        <div class="image-column">
            <img src="assets/images/about-puppy.jpg" alt="Volunteer with a rescued dog">
        </div>

    </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
